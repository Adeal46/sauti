name: Build IPA

# Builds an unsigned WolfCompanion.ipa on a GitHub-hosted Mac. Download it from the run's
# "Artifacts" section and install it with Sideloadly (see README).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # If GitHub retires this image, change it to macos-latest.
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download voice model
        run: |
          rm -rf App/Resources/KokoroModel
          set +e
          bash -x scripts/fetch-models.sh > fetch.log 2>&1
          status=$?
          set -e
          grep -v '%' fetch.log | tail -7 | while IFS= read -r line; do echo "::notice::fetch: $line"; done
          echo "::notice::fetch exit status $status"
          echo "::notice::Voice model folder: $(ls App/Resources/KokoroModel | tr '\n' ' ') ($(du -sh App/Resources/KokoroModel | cut -f1))"
          test -f App/Resources/KokoroModel/model.onnx

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project WolfCompanion.xcodeproj \
            -scheme WolfCompanion \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || true
          # Surface results as annotations (visible on the run page without opening logs).
          { grep -E "^/.*: error: " build.log || true; } | sort -u | head -20 | while IFS= read -r line; do
            echo "::error::${line#*/sauti/}"
          done
          APP="build/Build/Products/Release-iphoneos/WolfCompanion.app"
          if ! grep -q "BUILD SUCCEEDED" build.log || [ ! -f "$APP/WolfCompanion" ]; then
            echo "::error::Build failed — see the build-log artifact."
            exit 1
          fi
          BIN=$(du -h "$APP/WolfCompanion" | cut -f1)
          APPEX=$([ -f "$APP/PlugIns/WolfCompanionShare.appex/WolfCompanionShare" ] && echo yes || echo no)
          MODEL=$(ls "$APP/KokoroModel" 2>/dev/null | tr '\n' ' ')
          if [ ! -f "$APP/KokoroModel/model.onnx" ]; then
            echo "::error::Voice model missing from the app bundle."
            exit 1
          fi
          echo "::notice::Build OK on $(xcodebuild -version | head -1). App binary ${BIN}, share extension: ${APPEX}, voice files: ${MODEL}"

      - name: Package IPAs
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/WolfCompanion.app"
          # Plain ad-hoc signatures with no entitlements, so free Apple IDs can sign it
          # (no app group needed; the share extension falls back to the clipboard).
          if [ -d "$APP/PlugIns/WolfCompanionShare.appex" ]; then
            codesign --force --sign - "$APP/PlugIns/WolfCompanionShare.appex"
          fi
          codesign --force --sign - "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry WolfCompanion.ipa Payload
          # Simplest variant: no share extension (needs only one App ID).
          rm -rf Payload/WolfCompanion.app/PlugIns
          codesign --force --sign - Payload/WolfCompanion.app
          zip -qry WolfCompanion-no-extension.ipa Payload
          ls -lh *.ipa

      - name: Upload IPAs
        uses: actions/upload-artifact@v4
        with:
          name: WolfCompanion-ipa
          path: |
            WolfCompanion.ipa
            WolfCompanion-no-extension.ipa
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
